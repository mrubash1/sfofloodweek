name: build-data
on:
  push:
    branches: [pipeline]
    paths: ['pipeline/**', '.github/workflows/data.yml']
permissions:
  contents: write
concurrency: build-data
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r pipeline/requirements.txt
      - name: Build bay data
        run: python pipeline/build_data.py 2>&1 | tee pipeline/last_run.log
        continue-on-error: true
      - name: Commit outputs and log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data pipeline/last_run.log pipeline/cache || true
          git commit -m "data: pipeline output [skip ci]" || echo "nothing to commit"
          git push
