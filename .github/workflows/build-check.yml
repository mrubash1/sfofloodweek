name: build-check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: index.html and vercel.json CSP match src/
        run: python3 build.py --check
